staffchat-on: "<green>Mode staff chat <bold>aktif</bold>. Semua chat-mu ke staff."
staffchat-off: "<red>Mode staff chat <bold>nonaktif</bold>."
staffchat-format: "<dark_red>[<red>Staff<dark_red>] <gray><player><dark_gray>: <white><message>"





kit-none: "<red>Tidak ada kit yang bisa kamu pakai."
kit-list: "<green>Kit kamu: <white><kits>"
kit-unknown: "<red>Kit tidak ditemukan."
kit-given: "<green>Kit <white><kit> <green>diterima!"
