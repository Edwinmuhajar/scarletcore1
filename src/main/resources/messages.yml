# Format MiniMessage. Placeholder dalam < > jangan diubah namanya.
prefix: "<dark_red>[<red>Scarlet<dark_red>] <gray>"

only-player: "<red>Command ini hanya untuk player."
no-permission: "<red>Kamu tidak punya izin untuk itu."
player-not-found: "<red>Player <white><player> <red>tidak ditemukan / offline."
usage: "<yellow>Pemakaian: <white><usage>"
reloaded: "<green>Config dan pesan dimuat ulang."
cooldown: "<red>Tunggu <white><time> <red>lagi."

fly-on: "<green>Fly <bold>aktif</bold>."
fly-off: "<red>Fly <bold>nonaktif</bold>."
fly-other-on: "<green>Fly untuk <white><player> <green>aktif."
fly-other-off: "<red>Fly untuk <white><player> <red>nonaktif."
fly-gamemode: "<yellow><player> sudah bisa terbang di gamemode ini."

heal-done: "<green>Darah dan lapar kamu terisi penuh."
heal-other: "<green>Kamu menyembuhkan <white><player><green>."
feed-done: "<green>Lapar kamu terisi penuh."
feed-other: "<green>Kamu mengenyangkan <white><player><green>."

god-on: "<green>Mode god <bold>aktif</bold>."
god-off: "<red>Mode god <bold>nonaktif</bold>."
god-other-on: "<green>God untuk <white><player> <green>aktif."
god-other-off: "<red>God untuk <white><player> <red>nonaktif."

speed-walk: "<green>Kecepatan jalan: <white><speed>"
speed-fly: "<green>Kecepatan terbang: <white><speed>"
speed-reset: "<green>Kecepatan dikembalikan ke normal."

nick-set: "<green>Nama tampilan kamu sekarang: <white><nick>"
nick-reset: "<green>Nama tampilan dikembalikan."
