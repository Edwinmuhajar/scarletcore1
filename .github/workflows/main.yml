name: Build scarletcore.jar

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build
        run: mvn -B package
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: scarletcore (latest)
          files: target/scarletcore.jar
